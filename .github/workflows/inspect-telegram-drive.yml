name: Inspect Telegram Drive for Portability

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Source repository (blank = your Telegram-Drive fork)
        required: false
        default: ""
      upstream_ref:
        description: Source branch, tag, or commit
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  inspect:
    name: Telegram Drive Source Inspection
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout inspector repository
        uses: actions/checkout@v7

      - name: Resolve clean fork
        id: source
        shell: pwsh
        env:
          SOURCE_INPUT: ${{ inputs.upstream_repo }}
          REF_INPUT: ${{ inputs.upstream_ref }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          $repo = $env:SOURCE_INPUT
          if ([string]::IsNullOrWhiteSpace($repo)) {
            $repo = "$env:OWNER_NAME/Telegram-Drive"
          }
          $ref = $env:REF_INPUT
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "main" }
          "repository=$repo" >> $env:GITHUB_OUTPUT
          "revision=$ref" >> $env:GITHUB_OUTPUT
          Write-Host "Inspecting: $repo at $ref"

      - name: Checkout clean Telegram Drive fork
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.revision }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Record upstream revision
        id: revision
        shell: pwsh
        run: |
          $rev = (git -C upstream rev-parse HEAD).Trim()
          "sha=$rev" >> $env:GITHUB_OUTPUT
          Write-Host "Checked out commit: $rev"

      - name: Collect relevant source and portability report
        shell: pwsh
        run: |
          & .\scripts\Inspect-TelegramDrive-Source.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\TelegramDrive-Inspection"

      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDrive-Portability-Inspection-${{ steps.revision.outputs.sha }}
          path: artifact/TelegramDrive-Inspection/
          if-no-files-found: error
          retention-days: 30
