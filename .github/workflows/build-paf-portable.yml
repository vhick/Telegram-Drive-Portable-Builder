name: Build Telegram Drive PAF-Specific EXE

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Source repository (blank = your Telegram-Drive fork)
        required: false
        default: ""
      upstream_ref:
        description: Source branch/tag/commit
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: telegram-drive-paf-specific
  cancel-in-progress: false

jobs:
  build:
    name: Telegram Drive PAF Binary
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout builder
        uses: actions/checkout@v7

      - name: Resolve source fork
        id: source
        shell: pwsh
        env:
          SOURCE_INPUT: ${{ inputs.upstream_repo }}
          REF_INPUT: ${{ inputs.upstream_ref }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          $repo = $env:SOURCE_INPUT
          if ([string]::IsNullOrWhiteSpace($repo)) { $repo = "$env:OWNER_NAME/Telegram-Drive" }
          $ref = $env:REF_INPUT
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = 'main' }
          "repo=$repo" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Record revision
        id: revision
        shell: pwsh
        run: |
          $sha = (git -C upstream rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/app/src-tauri

      - name: Install original Node dependencies
        working-directory: upstream/app
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed: $LASTEXITCODE" }

      - name: Upgrade compatible Tauri dependencies
        shell: pwsh
        run: |
          & .\scripts\Upgrade-Tauri-Portable.ps1 -SourceRoot "$PWD\upstream"

      - name: Apply the proven Phase 1 patch
        shell: pwsh
        run: |
          & .\scripts\Apply-Phase1-Patch.ps1 -SourceRoot "$PWD\upstream"

      - name: Apply PAF top-level Data layout
        shell: pwsh
        run: |
          & .\scripts\Apply-PAF-Layout.ps1 -SourceRoot "$PWD\upstream"

      - name: Verify source and Tauri versions
        shell: pwsh
        run: |
          & .\scripts\Verify-Phase1-Patch.ps1 -SourceRoot "$PWD\upstream"
          & .\scripts\Verify-PAF-Layout.ps1 -SourceRoot "$PWD\upstream"

      - name: Build PAF-specific Windows executable
        working-directory: upstream/app
        shell: pwsh
        env:
          CI: 'true'
        run: |
          npx tauri build --no-bundle --config "$env:GITHUB_WORKSPACE\portable\tauri.paf.conf.json"
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed: $LASTEXITCODE" }

      - name: Assemble PAF-specific binary artifact
        shell: pwsh
        run: |
          & .\scripts\Assemble-PAF-Binary.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\PAF-Binary"

      - name: Upload PAF-specific executable
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDrive-PAF-Binary-Windows-x64-${{ steps.revision.outputs.sha }}
          path: artifact/PAF-Binary/
          if-no-files-found: error
          retention-days: 30
